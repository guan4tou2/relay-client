<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RelayClient</title>
  <!-- 嚴格 CSP：只允許同源資源、擋掉所有外部連線與載入（本 app 全離線運作，不依賴任何遠端資源） -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>
  <!-- 一般 script（不是 module）：最外層的宣告在各檔之間共用。lib（純邏輯）與 core 要最先、boot 要最後。 -->
  <script src="js/lib.js"></script>
  <script src="js/core.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/servers.js"></script>
  <script src="js/logs.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/route-panel.js"></script>
  <script src="js/overlays.js"></script>
  <script src="js/launcher.js"></script>
  <script src="js/io.js"></script>
  <script src="js/live.js"></script>
  <script src="js/split.js"></script>
  <script src="js/rulesets.js"></script>
  <script src="js/boot.js"></script>
</body>
</html>
