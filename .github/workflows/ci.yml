name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # 三平台都跑測試。目前只出 Windows 安裝檔，但 src/platform/ 的 adapter 與純函式邏輯
    # 在三個 OS 上都該通過——這樣移植時才不會等到打包才發現壞掉。
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: node --check main.js; node --check preload.js; node --check renderer/renderer.js
      - name: Unit tests
        run: npm test
