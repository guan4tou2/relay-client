name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Windows 與 Linux 都跑測試（macOS 暫不開發，但 darwin adapter 仍會在這兩個
    # runner 上被 forPlatform('darwin') 測到——adapter 的邏輯刻意與執行主機無關）。
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: node --check main.js; node --check preload.js; node --check renderer/renderer.js
      - name: Unit tests
        run: npm test
