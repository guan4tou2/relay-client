name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Windows 與 Linux 都跑測試（macOS 暫不開發，但 darwin adapter 仍會在這兩個
    # runner 上被 forPlatform('darwin') 測到——adapter 的邏輯刻意與執行主機無關）。
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # electron 套件本身要求 node >= 22.12 才能安裝，ESLint 10 也要 20.19 以上 —— 用目前的 LTS
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
