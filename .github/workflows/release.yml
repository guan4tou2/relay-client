name: Build & Release

# 推一個 v* tag（例如 v1.1.1）就會自動：跑測試 → 抓 sing-box 引擎 → 打包 →
# 發佈到 GitHub Releases（含 latest.yml 供自動更新）。
#
# 非 tag（推分支 / 手動觸發）一樣打包，但**不發佈**，而是把安裝檔上傳成
# artifact：進 Actions 點進那次執行就能下載，不用為了試裝而切一個版。
# 保留 14 天；安裝檔本身已壓縮，所以 compression-level: 0（再壓一次只是浪費時間）。
on:
  push:
    tags: ['v*']
    branches: ['**']      # 推分支也打包，產物上傳成 artifact（不發佈）
  workflow_dispatch: {}

permissions:
  contents: write   # 建立 / 更新 Release 需要

env:
  SING_BOX_VERSION: '1.12.25'   # 引擎版本（config schema 鎖定 1.12.x；1.13 有破壞性變更）

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Sync app version to tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          npm version $v --no-git-tag-version --allow-same-version
          Write-Host "Building version $v"

      - name: Fetch sing-box engine (TUN / gVisor)
        shell: pwsh
        run: |
          $v = "${{ env.SING_BOX_VERSION }}"
          $name = "sing-box-$v-windows-amd64"
          $url = "https://github.com/SagerNet/sing-box/releases/download/v$v/$name.zip"
          Write-Host "Downloading $url"
          # 下載與解壓一律放 runner 的暫存目錄，不要落在專案裡。
          # 之前是解在專案根目錄（sb.zip + sb/），而 electron-builder 的 files
          # 是 "**/*" 起頭 —— 那份 zip 跟解開的整棵樹就一起被打包進 app.asar，
          # 等於同一個引擎被塞了三份。實測 app.asar 因此從 2.8MB 變成 51.5MB，
          # 安裝檔多了 22MB（103.4MB vs 81.1MB）。
          $work = Join-Path $env:RUNNER_TEMP 'singbox'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $zip = Join-Path $work 'sb.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $work -Force
          New-Item -ItemType Directory -Force -Path engine | Out-Null
          Copy-Item (Join-Path $work "$name/sing-box.exe") "engine/sing-box.exe" -Force
          & "engine/sing-box.exe" version
          # sanity: the app uses stack "gvisor" — verify this binary accepts it
          $cfg = '{"log":{"level":"warn"},"inbounds":[{"type":"tun","tag":"t","interface_name":"proxyclient-tun","address":["172.19.0.1/30"],"mtu":9000,"auto_route":true,"strict_route":false,"stack":"gvisor"}],"outbounds":[{"type":"direct","tag":"direct"}],"route":{"final":"direct","auto_detect_interface":true}}'
          $chk = Join-Path $work 'sbcheck.json'
          Set-Content -Path $chk -Value $cfg -Encoding ascii
          & "engine/sing-box.exe" check -c $chk
          if ($LASTEXITCODE -ne 0) { throw "sing-box gVisor TUN config check failed — engine incompatible" }

      - name: Build (tag 才發佈；其餘只打包成 artifact)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          npm run make-icon
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) { npx electron-builder --win --publish always }
          else { npx electron-builder --win --publish never }

      # 只收安裝檔。dist/win-unpacked/ 是解開的整棵樹（上百 MB），千萬別整包上傳。
      - name: Upload installers (非 tag 才需要，tag 的已經在 Release 裡)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v5
        with:
          name: windows-installer-${{ github.run_number }}
          path: |
            dist/RelayClient-Setup-*.exe
            dist/RelayClient-Portable-*.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish release (un-draft, mark latest)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Sync app version to tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          npm version "$v" --no-git-tag-version --allow-same-version
          echo "Building version $v"

      - name: Fetch sing-box engine (TUN / gVisor)
        run: |
          set -euo pipefail
          v="${{ env.SING_BOX_VERSION }}"
          name="sing-box-$v-linux-amd64"
          # 下載與解壓一律放 runner 的暫存目錄，不要落在專案裡 ——
          # electron-builder 的 files 是 "**/*" 起頭，留在專案裡的 tar.gz
          # 跟解開的整棵樹都會被打包進去，等於同一個引擎塞了三份。
          work="${RUNNER_TEMP:-/tmp}/singbox"
          mkdir -p "$work" engine
          curl -fsSL -o "$work/sb.tar.gz" "https://github.com/SagerNet/sing-box/releases/download/v$v/$name.tar.gz"
          tar -xzf "$work/sb.tar.gz" -C "$work"
          cp "$work/$name/sing-box" engine/sing-box
          chmod +x engine/sing-box
          engine/sing-box version
          # sanity：app 用 stack "gvisor"，確認這顆 binary 吃得下
          cat > "$work/sbcheck.json" <<'JSON'
          {"log":{"level":"warn"},"inbounds":[{"type":"tun","tag":"t","interface_name":"proxyclient-tun","address":["172.19.0.1/30"],"mtu":9000,"auto_route":true,"strict_route":false,"stack":"gvisor"}],"outbounds":[{"type":"direct","tag":"direct"}],"route":{"final":"direct","auto_detect_interface":true}}
          JSON
          engine/sing-box check -c "$work/sbcheck.json"

      - name: Build (tag 才發佈；其餘只打包成 artifact)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            npx electron-builder --linux --publish always
          else
            npx electron-builder --linux --publish never
          fi

      - name: 列出產物
        run: ls -lh dist/ | grep -Ei 'appimage|deb' || ls -lh dist/

      # dist/linux-unpacked/ 同樣不收，只要 AppImage 與 deb。
      - name: Upload packages (非 tag 才需要，tag 的已經在 Release 裡)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v5
        with:
          name: linux-packages-${{ github.run_number }}
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
