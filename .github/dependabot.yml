# 依賴的安全更新自動開 PR。每週一次、同類的小版本合成一個 PR，避免一週十幾個 PR。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      runtime-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Electron 的主版本升級要跟著驗 TUN / 系統代理 / 打包，不自動開
      - dependency-name: electron
        update-types: [version-update:semver-major]
      # electron-store 9 起只有 ESM（src/store/config.js 用 require 載入）；要升級另開 PR，手動驗設定讀寫與舊設定檔相容
      - dependency-name: electron-store
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
